<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="refresh" content="2;url=html/home.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyFrames</title>
</head>
<style>
    
body{
    margin: 0;
    background-image: url("images/website_background.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.container{
    width:100%;
    height:100vh;
    background:rgba(12,15,18,0.7);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.welcome{
    text-align:center;
    margin-bottom:120px;
}

.logo{
    width:120px;
    margin-bottom:20px;
    animation: float 2.5s ease-in-out infinite;
}

.welcome h1{
    font-size:60px;
    color:white;
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
}



.welcome p{
    color:#cfcfcf;
    font-size:22px;
    letter-spacing:2px;
    margin-top:10px;
}

.load-box{
    text-align:center;
    margin-top:30px;
}

.load-box h2{
    color:white;
    font-size:28px;
    margin-bottom:20px;
}

.load{
    width:400px;
    height:12px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
}

.square{
    width:0;
    height:100%;
    background:#f5b700;
    animation:loading 5s linear forwards;
}

@keyframes loading{
    from{
        width:0%;
    }

    to{
        width:100%;
    }

}


</style>

<div class="container">

    <div class="welcome">

        <img src="images/logo.png" class="logo" alt="PayNest Logo">

        <h1>Welcome to <span>PayNest</span></h1>

        <p>Track. Manage. Grow.</p>

    </div>

    <div class="load-box">

        <h2>Loading Your Dashboard...</h2>

        <div class="load">
            <div class="square"></div>
        </div>

    </div>

</div>
</html>
