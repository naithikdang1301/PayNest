<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayNest | Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

<div class="overlay"></div>

<div class="login-box">

    <img src="../images/logo.png" class="logo" alt="logo">

    <h1>Welcome Back</h1>
    <p class="subtitle">Login to continue managing your expenses.</p>

    <form onsubmit="return loginUser()">

    <label>Email Address</label>
    <input type="email" id="email" placeholder="Enter your email" required>

    <label>Password</label>

<div class="password-box">
    <input type="password" id="password"
           placeholder="Enter your password" required>

    <span class="eye" onclick="togglePassword('password', this)">👁</span>
</div>

    <label>CAPTCHA</label>

    <div class="captcha-box">
        <div class="captcha" id="captchaText">A7K9XQ</div>

        <button type="button" class="refresh" onclick="refreshCaptcha()">
            ↻
        </button>
    </div>

    <input type="text" id="captchaInput"
           placeholder="Enter CAPTCHA" required>

    <div class="options">
        <label class="remember">
            <input type="checkbox">
            Remember Me
        </label>

        <a href="#" onclick="forgotPassword(); return false;">
            Forgot Password?
        </a>
    </div>

    <button type="submit" class="login-btn">
        Login →
    </button>

</form>

    <p class="signup">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
    </p>

</div>
<script src="../javascript/login.js"></script>
<script src="../javascript/common.js"></script>
</body>
</html>
