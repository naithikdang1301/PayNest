<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayNest | Sign Up</title>

    <link rel="stylesheet" href="../css/signup.css">
</head>

<body>

    <div class="overlay"></div>

    <div class="signup-box">

        <img src="../images/logo.png" alt="PayNest Logo" class="logo">

        <h1>Create Account</h1>

        <p class="subtitle">
            Start managing your expenses with PayNest.
        </p>

        <form onsubmit="return signupUser()">

            <label>Full Name</label>
            <input type="text" id="fullName"
                   placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" id="signupEmail"
                   placeholder="Enter your email" required>

            <label>Password</label>

<div class="password-box">
    <input type="password" id="signupPassword"
           placeholder="Create a password" required>

    <span class="eye" onclick="togglePassword('signupPassword', this)">👁</span>
</div>


<label>Confirm Password</label>

<div class="password-box">
    <input type="password" id="confirmPassword"
           placeholder="Confirm password" required>

    <span class="eye" onclick="togglePassword('confirmPassword', this)">👁</span>
</div>

            <label>Select Currency</label>

            <select id="currency" required>
                <option value="">Select Currency</option>
                <option value="INR">₹ Indian Rupee (INR)</option>
                <option value="USD">$ US Dollar (USD)</option>
                <option value="EUR">€ Euro (EUR)</option>
                <option value="GBP">£ Pound (GBP)</option>
                <option value="JPY">¥ Japanese Yen (JPY)</option>
            </select>

            <label>CAPTCHA</label>

            <div class="captcha-box">

                <div class="captcha" id="captchaText">P8R4MN</div>

                <button type="button" class="refresh"
                        onclick="refreshSignupCaptcha()">
                    ↻
                </button>

            </div>

            <input type="text" id="signupCaptcha"
                   placeholder="Enter CAPTCHA" required>

            <button type="submit" class="signup-btn">
                Create Account →
            </button>

        </form>

        <p class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

    <script src="../javascript/signup.js"></script>
<script src="../javascript/common.js"></script>
</body>

</html>
